<!DOCTYPE html>
<!-- Throwaway verification harness (not part of the app - delete after use).
     Loads both roles in same-origin iframes so BroadcastChannel connects
     them, adds a surface, drags it into a trapezoid, and lets the output
     iframe render the warped pattern for a screenshot. -->
<html>
<head>
  <style>
    body { margin: 0; display: flex; background: #333; }
    iframe { width: 50vw; height: 100vh; border: 2px solid #666; box-sizing: border-box; }
  </style>
</head>
<body>
  <iframe id="ctl" src="mapper.html"></iframe>
  <iframe id="out" src="mapper.html?output"></iframe>
  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        const win = document.getElementById("ctl").contentWindow;
        win.localStorage.clear();
        // Top-level let/const in mapper.js aren't window properties, but
        // indirect eval runs in that realm's global scope and can see them.
        win.eval(`
          addSurface();
          // Trapezoid: narrow top, wide bottom - grid must keystone, not skew.
          project.surfaces[0].corners = [[0.35,0.15],[0.65,0.15],[0.9,0.85],[0.1,0.85]];
          commitProjectChange();
        `);
      }, 500);
    });
  </script>
</body>
</html>
