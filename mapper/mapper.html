<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Mapper</title>
  <link rel="stylesheet" href="mapper.css">
</head>
<body>

  <!-- ============ CONTROL ROLE (plain URL) ============ -->
  <div id="control-root" class="control-root" hidden>
    <header class="header-bar">
      <h1>Wall Mapper</h1>
      <div class="header-actions">
        <button id="btn-open-output" type="button">Open output window</button>
        <button id="btn-identify" type="button">Identify</button>
        <button id="btn-export" type="button">Export</button>
        <button id="btn-import" type="button">Import</button>
        <input type="file" id="file-import" accept="application/json" hidden>
      </div>
    </header>

    <div class="main-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Surfaces</h2>
          <button id="btn-add-surface" type="button">+ Add surface</button>
        </div>
        <ul id="surface-list" class="surface-list"></ul>
      </aside>

      <main class="preview-area">
        <div class="preview-box">
          <svg id="preview-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </main>
    </div>
  </div>

  <!-- ============ OUTPUT ROLE (?output) ============ -->
  <div id="output-root" class="output-root" hidden>
    <!-- Per-surface matrix3d-warped wrapper divs land here (see WARP / OUTPUT
         RENDERING in mapper.js). Replaces the slice-1 SVG placeholder. -->
    <div id="output-surfaces" class="output-surfaces"></div>
    <!-- Identify overlay: unwarped screen-space labels at each surface's
         centroid, shown briefly in response to a broadcast 'identify'. -->
    <div id="output-identify" class="output-identify"></div>
  </div>

  <script src="mapper.js"></script>
</body>
</html>
